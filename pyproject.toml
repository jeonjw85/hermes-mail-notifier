[project]
name = "hermes-mail-notifier"
version = "0.2.0"
description = "Important-email summaries for Hermes Agent and Telegram"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["cryptography>=50.0.1,<51"]

[project.optional-dependencies]
dev = ["ruff==0.17.0", "pyright==1.1.414"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["mail_notifier", "__init__.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.setuptools.packages.find]
include = ["mail_notifier*"]
