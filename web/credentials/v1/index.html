<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://telegram.org; style-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Mail app password / 메일 앱 비밀번호</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main>
    <header>
      <label id="language-label" for="language">Language / 표시 언어</label>
      <select id="language">
        <option value="en" lang="en">English</option>
        <option value="ko" lang="ko">한국어</option>
      </select>
    </header>
    <h1 id="title">Mail app password / 메일 앱 비밀번호</h1>
    <p id="intro"></p>
    <dl>
      <dt id="account-label"></dt><dd id="account"></dd>
      <dt id="provider-label"></dt><dd id="provider"></dd>
      <dt id="expires-label"></dt><dd id="expires"></dd>
    </dl>
    <form id="credential-form" autocomplete="off">
      <label id="password-label" for="password">App password / 앱 비밀번호</label>
      <input id="password" type="password" aria-describedby="password-help" autocomplete="off" autocapitalize="none" spellcheck="false" disabled>
      <p id="password-help"></p>
      <div class="actions">
        <button id="submit" type="submit" disabled>Submit / 제출</button>
        <button id="cancel" type="button">Cancel / 취소</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite">Open the bot’s secure input keyboard button in Telegram, or use hermes mail-notifier setup in the CLI. / Telegram에서 봇의 보안 입력 키보드 버튼을 열거나 CLI에서 hermes mail-notifier setup을 실행하세요.</p>
    <p id="privacy" class="privacy"></p>
    <noscript>JavaScript is required. Use hermes mail-notifier setup in the CLI instead. / JavaScript가 필요합니다. CLI에서 hermes mail-notifier setup을 실행하세요.</noscript>
  </main>
</body>
</html>
