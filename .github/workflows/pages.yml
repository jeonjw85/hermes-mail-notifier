name: publish credential page (manual)

# Prepared only. Enabling Pages and dispatching require separate operator approval.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: credential-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static credential page
        id: deployment
        uses: actions/deploy-pages@v4
